plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.itmo.plugin-service'
version = '0.0.1-SNAPSHOT'
description = 'simple-plugin-registry'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def dockerImageName = providers.gradleProperty('dockerImageName')
        .orElse("${project.name}:${project.version}")

tasks.register('dockerBuild', Exec) {
    group = 'docker'
    description = 'Builds the application JAR and a Docker image.'
    dependsOn tasks.named('bootJar')

    doFirst {
        def bootJarFile = tasks.named('bootJar').get().archiveFile.get().asFile

        commandLine 'docker', 'build',
                '--build-arg', "JAR_FILE=${project.relativePath(bootJarFile)}",
                '--tag', dockerImageName.get(),
                '.'
    }
}
