name: deploy frontend

on:
  push:
    branches: ['**']
    paths: ['frontend/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/dev' && 'stage' || github.ref == 'refs/heads/master' && 'prod' || '' }}
    concurrency:
      group: frontend-${{ github.ref }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: webfactory/ssh-agent@v0.10.0
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false

      - name: deploy
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/dev' && 'stage' || 'prod' }}
        run: rsync -az --delete -e 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' dist/ "$DEPLOY_USER@$DEPLOY_HOST:/srv/dwspurpleteam/static/$DEPLOY_ENV/"
