name: ci

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - run: ./gradlew build
