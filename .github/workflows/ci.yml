name: ci

on:
  push:
    branches: ['**']

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - run: ./gradlew build

      - name: artifact
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: build/libs/simple-plugin-registry-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  image:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    needs: backend
    uses: dwspurpleteam/.github/.github/workflows/image.yml@main
    with:
      service: pluginregistry
      artifact: application
      artifact-path: build/libs
    secrets: inherit
