spring:
  application:
    name: simple-plugin-registry
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plugin_registry}
    username: ${DB_USERNAME:plugin_registry_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          json_format_mapper: jackson3
  flyway:
    enabled: true

springdoc:
  paths-to-match: /v1/**, /health
  swagger-ui:
    path: /swagger-ui

server:
  port: ${SERVER_PORT:8080}
